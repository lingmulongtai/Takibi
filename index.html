<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101522" />
    <meta
      name="description"
      content="夕暮れの海辺の焚き火をリアルタイムWebGL2と無限のプロシージャル環境音で再現するチルサイト"
    />
    <title>Takibi — 海辺の夕暮れ、焚き火の音</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='68%25' r='55%25'%3E%3Cstop offset='0%25' stop-color='%23fff6cf'/%3E%3Cstop offset='45%25' stop-color='%23ff942e'/%3E%3Cstop offset='100%25' stop-color='%23182238'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23121828'/%3E%3Cpath d='M32 10c4 9 13 15 13 26a13 13 0 1 1-26 0c0-6 3-11 6-15 0 4 2 6 4 7 0-7 1-12 3-18z' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/controls.css" />
  </head>
  <body class="ui-visible sound-locked">
    <main class="stage" aria-label="海辺の焚き火シーン">
      <canvas id="takibi-canvas" class="stage__canvas" aria-label="リアルタイム焚き火グラフィック"></canvas>

      <div id="webgl-fallback" class="fallback" hidden>
        <div class="fallback__card">
          <p class="fallback__eyebrow">TAKIBI</p>
          <h1 class="fallback__title">WebGL2に対応したブラウザでご覧ください</h1>
          <p class="fallback__message" id="fallback-message">
            このサイトは高精細なリアルタイム・ボリューメトリック描画のために WebGL2 を使用します。
          </p>
        </div>
      </div>

      <header class="brand" aria-hidden="true">
        <span class="brand__title">TAKIBI</span>
        <span class="brand__subtitle">twilight shore</span>
      </header>

      <button
        id="sound-prompt"
        class="sound-prompt"
        type="button"
        aria-label="焚き火と波の音を再生する"
      >
        <span class="sound-prompt__pulse" aria-hidden="true"></span>
        <svg class="sound-prompt__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M11 5L6 9H3v6h3l5 4V5z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
        <span class="sound-prompt__label">音をつける</span>
      </button>

      <aside class="hud" id="hud" aria-label="環境コントロール">
        <div class="hud__panel" id="settings-drawer" hidden>
          <div class="drawer__section">
            <div class="drawer__header">
              <span class="drawer__heading">サウンド</span>
              <span class="drawer__hint">無限プロシージャル音源</span>
            </div>

            <label class="slider-row">
              <span class="slider-row__label">焚き火</span>
              <input id="slider-fire" type="range" min="0" max="1" step="0.01" value="0.82" />
              <span class="slider-row__value" id="val-fire">82%</span>
            </label>

            <label class="slider-row">
              <span class="slider-row__label">パチパチ</span>
              <input id="slider-crackle" type="range" min="0" max="1" step="0.01" value="0.88" />
              <span class="slider-row__value" id="val-crackle">88%</span>
            </label>

            <label class="slider-row">
              <span class="slider-row__label">波の音</span>
              <input id="slider-ocean" type="range" min="0" max="1" step="0.01" value="0.38" />
              <span class="slider-row__value" id="val-ocean">38%</span>
            </label>
          </div>

          <div class="drawer__divider"></div>

          <div class="drawer__section">
            <div class="drawer__header">
              <span class="drawer__heading">空の時間</span>
            </div>
            <div class="pill-group" role="radiogroup" aria-label="空の時間帯">
              <button type="button" class="pill is-active" data-mood="twilight" aria-pressed="true">
                黄昏
              </button>
              <button type="button" class="pill" data-mood="bluehour" aria-pressed="false">
                藍時
              </button>
              <button type="button" class="pill" data-mood="night" aria-pressed="false">
                夜更け
              </button>
            </div>
          </div>

          <div class="drawer__divider"></div>

          <div class="drawer__section">
            <div class="drawer__header">
              <span class="drawer__heading">画質</span>
              <span class="drawer__hint" id="resolution-readout">Ultra</span>
            </div>
            <div class="pill-group" role="radiogroup" aria-label="描画品質">
              <button type="button" class="pill is-active" data-quality="ultra" aria-pressed="true">
                Ultra
              </button>
              <button type="button" class="pill" data-quality="high" aria-pressed="false">
                High
              </button>
              <button type="button" class="pill" data-quality="balanced" aria-pressed="false">
                Balanced
              </button>
            </div>
          </div>
        </div>

        <div class="hud__bar">
          <button
            id="btn-sound"
            class="hud-btn hud-btn--primary"
            type="button"
            aria-label="音のオン・オフ (M)"
            title="音 (M)"
          >
            <svg class="hud-btn__icon icon-sound-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M11 5L6 9H3v6h3l5 4V5z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <svg class="hud-btn__icon icon-sound-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M11 5L6 9H3v6h3l5 4V5zM22 9l-6 6M16 9l6 6"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="hud-btn__text" id="btn-sound-label">消音</span>
          </button>

          <button
            id="btn-stoke"
            class="hud-btn"
            type="button"
            aria-label="薪をくべて火を強める (Space)"
            title="薪をくべる (Space)"
          >
            <svg class="hud-btn__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M12 3c2.5 4.2 6.5 7 6.5 11.8a6.5 6.5 0 1 1-13 0c0-2.8 1.3-5.2 3-7 .2 1.8 1.1 2.9 2.2 3.4-.3-3.2.2-5.5 1.3-8.2z"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linejoin="round"
              />
            </svg>
            <span class="hud-btn__text">薪をくべる</span>
          </button>

          <span class="hud__sep" aria-hidden="true"></span>

          <button
            id="btn-settings"
            class="hud-btn hud-btn--icon"
            type="button"
            aria-label="音量と画質の設定"
            aria-expanded="false"
            aria-controls="settings-drawer"
            title="設定"
          >
            <svg class="hud-btn__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M4 7h10M18 7h2M4 17h4M12 17h8M14 7a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM8 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <button
            id="btn-fullscreen"
            class="hud-btn hud-btn--icon"
            type="button"
            aria-label="全画面表示 (F)"
            title="全画面 (F)"
          >
            <svg class="hud-btn__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </aside>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
